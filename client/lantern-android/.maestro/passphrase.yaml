# Needs a Google account on the emulator and `scripts/verify-env.sh up` running. It signs in and
# walks About you and Board through board.yaml first.
# Run: maestro test .maestro/passphrase.yaml
appId: com.lantern.app
---
- runFlow: board.yaml
- assertVisible: 'Choose a family passphrase'
- assertVisible:
    text: 'Create passphrase'
    enabled: false
- scrollUntilVisible:
    element:
      id: 'passphrase-field'
- tapOn:
    id: 'passphrase-field'
- inputText: 'blue lantern 2026'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'again-field'
- tapOn:
    id: 'again-field'
- inputText: 'blue lantern'
- hideKeyboard
- assertVisible: 'The two passphrases are not the same.'
- scrollUntilVisible:
    element:
      id: 'again-field'
- tapOn:
    id: 'again-field'
- inputText: ' 2026'
- hideKeyboard
- assertNotVisible: 'The two passphrases are not the same.'
- assertVisible:
    text: 'Create passphrase'
    enabled: false
- scrollUntilVisible:
    element: "I understand Lantern can't reset or change it, and I will keep it safe."
- tapOn: "I understand Lantern can't reset or change it, and I will keep it safe."
- assertVisible:
    text: 'Create passphrase'
    enabled: true
- tapOn: 'Create passphrase'
- extendedWaitUntil:
    visible: 'Save your recovery code'
    timeout: 30000
- assertVisible: 'Step 3 of 4'
- assertVisible: 'RECOVERY CODE'
- assertNotVisible: 'Back'
- assertVisible:
    text: 'Continue'
    enabled: false
- scrollUntilVisible:
    element: 'Save elsewhere'
- tapOn: 'Save elsewhere'
- pressKey: back
- scrollUntilVisible:
    element: 'I have saved my recovery code somewhere safe.'
- tapOn: 'I have saved my recovery code somewhere safe.'
- assertVisible:
    text: 'Continue'
    enabled: true
- tapOn: 'Continue'
- assertVisible: 'First child comes next'
- assertVisible: 'Step 4 of 4'
- tapOn: 'Back'
- assertVisible: 'Save your recovery code'
