# Needs a Google account on the emulator and `scripts/verify-env.sh up` running. It registers Aarav (Class 4) and
# Mira (Class 2) through first-child.yaml, then opens Add a child from the Child switcher on the Chapters screen.
# Run: maestro test .maestro/add-child-from-chapters.yaml
appId: com.lantern.app
---
- runFlow: first-child.yaml
- tapOn: 'Mathematics.*'
- assertVisible: 'Mathematics for Aarav'
- tapOn: 'Switch child, now Aarav'
- tapOn: 'Add a child'
- assertVisible: 'A Family can have up to 6 Children.'
- tapOn: 'Back'
- assertVisible: 'Mathematics for Aarav'
