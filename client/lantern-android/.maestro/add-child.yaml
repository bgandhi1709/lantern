# Needs a Google account on the emulator and `scripts/verify-env.sh up` running. It registers Aarav (Class 4) and
# Mira (Class 2) through first-child.yaml, which ends on Home, then adds Rohan (Class 3) from the Child switcher.
# Run: maestro test .maestro/add-child.yaml
appId: com.lantern.app
---
- runFlow: first-child.yaml
- tapOn: 'Switch child, now Aarav'
- tapOn: 'Add a child'
- assertVisible: 'A Family can have up to 6 Children.'
- assertVisible:
    text: 'Add child'
    enabled: false
- tapOn:
    id: 'child-name'
- inputText: 'Rohan'
- hideKeyboard
- tapOn: 'Class 3'
- assertVisible:
    text: 'Add child'
    enabled: false
- tapOn:
    id: 'child-year'
# The year list opens at the newest years, so 2015 is below the first screen.
- scrollUntilVisible:
    element: '2015'
- tapOn: '2015'
- assertVisible:
    text: 'Add child'
    enabled: true
- tapOn: 'Add child'
- extendedWaitUntil:
    visible: "Rohan's Subjects, Class 3"
    timeout: 120000
- assertVisible: 'Switch child, now Rohan'
- tapOn: 'Switch child, now Rohan'
- assertVisible: 'Aarav.*'
- assertVisible: 'Mira.*'
- assertVisible: 'Rohan.*'
