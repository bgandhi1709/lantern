# Needs a Google account on the emulator and `scripts/verify-env.sh up` running, with no Family yet for that account
# (first-child.yaml registers one). It opens Settings from Home, picks a colour, a theme and a text size, restarts
# the app and checks the choices are still picked.
# Run: maestro test .maestro/appearance.yaml
appId: com.lantern.app
---
- runFlow: first-child.yaml
- assertVisible: "Aarav's Subjects, Class 4"
- tapOn: 'Settings'
- assertVisible: 'Appearance'
- tapOn: 'Blue. Classic.'
- tapOn: 'Dark'
- tapOn: 'Largest text size'
- assertVisible:
    text: 'Dark'
    checked: true
- scrollUntilVisible:
    element: 'Saved on this phone only. Signing out keeps these.'
- stopApp
- openLink: 'lantern://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
- extendedWaitUntil:
    visible: "Aarav's Subjects, Class 4"
    timeout: 120000
- tapOn: 'Settings'
- assertVisible:
    text: 'Dark'
    checked: true
- assertVisible:
    text: 'Largest text size'
    checked: true
- assertVisible:
    text: 'Blue. Classic.'
    checked: true
- back
- assertVisible: "Aarav's Subjects, Class 4"
