# Needs a Google account on the emulator and `scripts/verify-env.sh up` running. It walks the four
# steps through passphrase.yaml, then adds a first and an extra Child, finishes, lands on Home, and lands on Home again after a restart.
# Run: maestro test .maestro/first-child.yaml
appId: com.lantern.app
---
- runFlow: passphrase.yaml
- scrollUntilVisible:
    element: 'I have sent the email to myself.'
- tapOn: 'I have sent the email to myself.'
- tapOn: 'Continue'
- assertVisible: 'Add your first child'
- assertVisible: 'Step 4 of 4'
- assertVisible:
    text: 'Finish'
    enabled: false
- tapOn:
    id: 'child-1-name'
- inputText: 'Aarav'
- hideKeyboard
- tapOn: 'Class 4'
- assertVisible:
    text: 'Finish'
    enabled: false
- tapOn:
    id: 'child-1-year'
- tapOn: '2017'
- assertVisible:
    text: 'Finish'
    enabled: true
- scrollUntilVisible:
    element: 'Add another child'
- tapOn: 'Add another child'
- scrollUntilVisible:
    element:
      id: 'child-2-name'
- tapOn:
    id: 'child-2-name'
- inputText: 'Mira'
- hideKeyboard
- assertVisible: 'Needs name, class and birth year'
- assertVisible:
    text: 'Finish'
    enabled: false
# The message waits until the Parent closes the card, so it never speaks while they type.
- assertNotVisible: 'Finish or remove the extra child to continue.'
- tapOn: 'Needs name, class and birth year'
- assertVisible: 'Finish or remove the extra child to continue.'
- tapOn: 'Needs name, class and birth year'
- scrollUntilVisible:
    element:
      id: 'child-2-class'
- tapOn:
    id: 'child-2-class'
- tapOn: 'Class 2'
- scrollUntilVisible:
    element:
      id: 'child-2-year'
- tapOn:
    id: 'child-2-year'
- tapOn: '2020'
- assertVisible: 'Class 2, ready to add'
- assertVisible:
    text: 'Finish'
    enabled: true
- tapOn: 'Finish'
- extendedWaitUntil:
    visible: "Aarav's Subjects, Class 4"
    timeout: 60000
# A fresh start asks GET /v1/me, which must now find the Family and go to Home, not to About you.
- stopApp
- openLink: 'lantern://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
- extendedWaitUntil:
    visible: "Aarav's Subjects, Class 4"
    timeout: 120000
