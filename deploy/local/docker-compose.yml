name: lantern-local

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data

  api:
    build:
      context: ../..
      dockerfile: apps/lantern-api/Dockerfile
    depends_on:
      - azurite
    ports:
      - "${LANTERN_HTTPS_PORT:-443}:8443"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8443
      Kestrel__Certificates__Default__Path: /certs/local.lantern.api.crt
      Kestrel__Certificates__Default__KeyPath: /certs/local.lantern.api.key
      Storage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    volumes:
      - ./certs:/certs:ro
    networks:
      default:
        aliases:
          - local.lantern.api

volumes:
  azurite-data:
