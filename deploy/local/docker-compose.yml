name: lantern-local

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data

  auth-emulator:
    build: ./auth-emulator
    ports:
      - "127.0.0.1:9099:9099"

  lavinmq:
    image: cloudamqp/lavinmq:2.10.2
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  broker-topology:
    image: alpine:3
    depends_on:
      - lavinmq
    volumes:
      - ../../infra:/infra:ro
    command: ["sh", "-c", "apk add --no-cache bash curl jq > /dev/null && bash /infra/apply-topology.sh amqp://guest:guest@lavinmq:5672"]
    restart: "no"

  # The Functions app, as it runs in Azure: it takes each action message and finishes it.
  functions:
    build:
      context: ../..
      dockerfile: apps/lantern-api/Lantern.Functions/Dockerfile
    depends_on:
      azurite:
        condition: service_started
      broker-topology:
        condition: service_completed_successfully
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      Actions__Exchange: lantern.actions
      Actions__CreateWorkspaceQueue: create-workspace
      Actions__RemoveWorkspaceQueue: remove-workspace
      Actions__RemoveFamilyQueue: remove-family
      Storage__ParentsTable: parents
      Storage__FamiliesTable: families
      Storage__ActionsTable: actions
      Storage__ProgressTable: progress
      Storage__WorkspaceContainer: family
      Catalog__NcertContainer: ncert
      Catalog__SscContainer: ssc
      Broker__Url: "amqp://guest:guest@lavinmq:5672"
      Storage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

  api:
    build:
      context: ../..
      dockerfile: deploy/local/api.Dockerfile
    depends_on:
      azurite:
        condition: service_started
      auth-emulator:
        condition: service_started
      broker-topology:
        condition: service_completed_successfully
    ports:
      - "${LANTERN_HTTPS_PORT:-443}:8443"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kestrel__Certificates__Default__Path: /certs/local.lantern.api.crt
      Kestrel__Certificates__Default__KeyPath: /certs/local.lantern.api.key
      Storage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      Actions__Exchange: lantern.actions
      Local__SeedBoardMasters: "${LANTERN_SEED_BOARD_MASTERS:-true}"
      Broker__Url: "amqp://guest:guest@lavinmq:5672"
    volumes:
      - ./certs:/certs:ro
    networks:
      default:
        aliases:
          - local.lantern.api

volumes:
  azurite-data:
