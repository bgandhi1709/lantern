name: Android - Expo version drift

# Expo publishes SDK patch versions without notice, and expo-doctor in android.yml then fails the next pull request
# for a reason that pull request did not cause. This weekly run on main shows the drift on its own, before that.
# The fix is `npx expo install --check`, then the patch bumps in one small PR.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: client/lantern-android

jobs:
  doctor:
    name: expo-doctor on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/lantern-android/package-lock.json
      - run: npm ci
      - run: npx --yes expo-doctor@1.20.4
