name: API - Build, Test and Release

# Runs only when the API changes, so an infra-only change never triggers it.
on:
  pull_request:
    # labeled: adding deploy-uat to an open PR starts its UAT deploy.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - apps/lantern-api/**
      - libs/**
      - tests/lantern-api/**
      - deploy/local/**
      - infra/**
      - .github/workflows/api.yml
  push:
    branches: [main]
    paths:
      - apps/lantern-api/**
      - libs/**
      - tests/lantern-api/**
      - deploy/local/**
      - infra/**
      - .github/workflows/api.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-lantern-dev
  # A push to main, a manual run on main, or a PR labelled deploy-uat releases to uat (still behind the uat approval).
  # Azure trusts only the pull_request, main and environment:uat token subjects, so a manual run on another branch
  # cannot sign in; label the PR instead.
  RELEASE: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'deploy-uat') }}
  PARAMS: infra/params/lantern.uat.bicepparam

# One release at a time; never cancel one that is running.
concurrency:
  group: api-uat
  cancel-in-progress: false

jobs:
  build-test:
    name: Build and test
    # Pull requests from forks get no Azure token and should not push images.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Guardrails
        run: |
          # A script without the executable bit fails on the runner with "Permission denied".
          bad=$(git ls-files -s 'deploy/*.sh' 'infra/*.sh' | grep -v '^100755' || true)
          [ -z "$bad" ] || { echo "Not executable (git update-index --chmod=+x):"; echo "$bad"; exit 1; }
          # apps/ and libs/ are production code only; tests and local stand-ins live under tests/.
          hits=$(grep -rnE 'Xunit|Seeder|LocalKeyVaultClient|WebApplicationFactory' apps libs --include='*.cs' --include='*.csproj' || true)
          [ -z "$hits" ] || { echo "Test or dev-only code in a production project:"; echo "$hits"; exit 1; }
      - run: npm install -g azurite@3
      - run: dotnet build Lantern.slnx -c Release
      # The E2E tests (Category=E2E) need the Docker stack; they run in the e2e-docker job.
      - run: dotnet test --solution Lantern.slnx -c Release --no-build --filter-not-trait "Category=E2E"

  # The same E2E tests the cloud used to run, against the Docker stack in deploy/local: Azurite, the Firebase Auth
  # Emulator, a key file for Key Vault and a seeded dev Family. It gates the release.
  e2e-docker:
    name: E2E - docker
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: deploy/local/setup.sh --no-windows
      - run: docker compose -f deploy/local/docker-compose.yml up --build -d
      - run: curl --silent --fail --retry 30 --retry-delay 3 --retry-all-errors https://local.lantern.api/health/live
      - run: >
          dotnet test --project tests/lantern-api/Lantern.Api.Test.Integration -c Release
          --filter-trait "Category=E2E"
        env:
          E2E_BASE_URL: https://local.lantern.api
          E2E_AUTH_EMULATOR: http://127.0.0.1:9099
      - if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs

  # Lint and what-if the Bicep (read-only) so a bad infra edit fails here; the deploy job applies it.
  infra-check:
    name: Infra - lint and what-if
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep lint --file infra/main.bicep
      # What bootstrap.sh sets up once (providers, roles), checked on the PR so a gap never reaches a release.
      - run: infra/preflight.sh "$RESOURCE_GROUP" uat
      - run: infra/keep-running-image.sh
      - run: az deployment group what-if -g "$RESOURCE_GROUP" -f infra/main.bicep -p "$PARAMS"

  image:
    name: Build image
    needs: [build-test, e2e-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tag
        run: echo "value=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - run: docker build -f apps/lantern-api/Dockerfile -t "ghcr.io/${{ github.repository_owner }}/lantern-api:${{ steps.tag.outputs.value }}" .
      - run: docker build -f apps/lantern-api/Lantern.Functions/Dockerfile -t "ghcr.io/${{ github.repository_owner }}/lantern-functions:${{ steps.tag.outputs.value }}" .
      # Pushed only for a release (see RELEASE). GHCR inherits the repository's (public) visibility on first push,
      # so the Container App needs no pull credential.
      - if: env.RELEASE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.RELEASE == 'true'
        run: |
          docker push "ghcr.io/${{ github.repository_owner }}/lantern-api:${{ steps.tag.outputs.value }}"
          docker push "ghcr.io/${{ github.repository_owner }}/lantern-functions:${{ steps.tag.outputs.value }}"

  deploy:
    name: Deploy - uat
    needs: [image, infra-check]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'deploy-uat')
    runs-on: ubuntu-latest
    # Required reviewers on this environment gate the deployment.
    environment: uat
    permissions:
      id-token: write
      contents: read
    steps:
      # The Bicep file and its parameters are read from the repo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Checked again here: a role or provider can be removed between the PR and the release. Read-only.
      - run: infra/preflight.sh "$RESOURCE_GROUP" uat
      # The release is one Bicep deployment: it applies any infra change and sets the new images and the API's port in the
      # same revision, so infra, API and Functions app can never collide.
      - run: az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep -p "$PARAMS" -n "release-${GITHUB_RUN_ID}"
        env:
          CONTAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/lantern-api:${{ needs.image.outputs.tag }}
          FUNCTIONS_IMAGE: ghcr.io/${{ github.repository_owner }}/lantern-functions:${{ needs.image.outputs.tag }}
          CONTAINER_PORT: 8080
      # Smoke check: the app is up and refuses an anonymous caller. No secrets, no Firebase.
      - run: |
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-lantern-uat --query properties.configuration.ingress.fqdn -o tsv)
          curl --silent --fail --retry 30 --retry-delay 5 --retry-all-errors "https://${fqdn}/health/live"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://${fqdn}/v1/me")
          [ "$status" = 401 ] || { echo "::error::GET /v1/me without a token returned $status, expected 401"; exit 1; }
