name: Infra - Build and Deploy

# Runs only when infrastructure files change, so an API release never triggers it.
on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deployment at a time; never cancel one that is running.
concurrency:
  group: infra-uat
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-lantern-dev
  PARAMS: infra/params/lantern.uat.bicepparam

jobs:
  build:
    name: Build - lint and what-if
    # Pull requests from forks get no Azure token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep lint --file infra/main.bicep
      - run: infra/keep-running-image.sh
      - run: az deployment group what-if -g "$RESOURCE_GROUP" -f infra/main.bicep -p "$PARAMS"

  deploy:
    name: Deploy - uat
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers on this environment gate the deployment.
    environment: uat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: infra/keep-running-image.sh
      - run: az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep -p "$PARAMS" -n "infra-${GITHUB_RUN_ID}"
