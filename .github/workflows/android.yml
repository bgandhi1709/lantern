name: Android - Check and Build

# Checks run on every pull request that touches the app. The signed APK is built only on a manual run, behind the
# uat environment's approval, because the build reads the UAT address and the signing key from that environment's
# secrets. The repository is public: anyone signed in to GitHub can download its artifacts, so the APK expires after
# one day and holds nothing that is a credential (the API still needs a Firebase sign-in).
on:
  pull_request:
    paths:
      - client/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client/lantern-android

jobs:
  checks:
    name: Typecheck, lint, bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/lantern-android/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx --yes expo-doctor@1.20.4
      # The bundle needs some address to compile; this one is not real.
      - run: npx expo export --platform android
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.invalid

  build:
    name: Build signed APK
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Required reviewers on this environment gate the build, which reads its secrets.
    environment: uat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/lantern-android/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      # Reuses Gradle's downloads and unchanged task outputs between runs. cache-read-only is off so a run on any branch
      # saves its cache (the default writes only from the default branch, and builds here are manual runs on any branch).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
      - name: Check the UAT address
        env:
          LANTERN_API_URL: ${{ secrets.LANTERN_API_URL }}
        run: |
          # Secrets are masked in logs, but the bare host name is not, so mask it too. Nothing here prints the address.
          [[ "$LANTERN_API_URL" == https://* ]] || { echo "::error::LANTERN_API_URL is missing or is not an https:// address"; exit 1; }
          host=$(sed -E 's#^https://([^/]+).*#\1#' <<< "$LANTERN_API_URL")
          echo "::add-mask::$host"
      - run: npm ci
      - name: Decode the Firebase file
        # Prebuild reads it twice: the Firebase plugin copies it, and app.config.js takes the Google web client from it.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]] || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 is missing"; exit 1; }
          base64 -d <<< "$GOOGLE_SERVICES_JSON_BASE64" > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Decode the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Give Gradle 4 GB of heap
        # The generated gradle.properties asks for 2 GB; the runner has 16 GB. The last value of a repeated key wins.
        # The file has no final newline, so start with one: without it the value is glued onto the last property
        # and Expo's autolinking fails to parse it.
        working-directory: client/lantern-android/android
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          grep '^org.gradle.jvmargs' gradle.properties
      - name: Build the release APK
        working-directory: client/lantern-android/android
        # arm64-v8a only: nearly every phone since about 2017 is arm64, and the native code is compiled once, not four times.
        # The APK will not install on an x86 emulator or a 32-bit phone.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        # Only this step sees the key's passwords and the address, not npm's install scripts.
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.LANTERN_API_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Check the APK
        run: |
          # Release builds must not allow cleartext traffic (only the debug manifest does).
          if grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml; then
            echo "::error::The release manifest allows cleartext traffic"; exit 1
          fi
          # Cloud backup must stay off: nothing the app stores may leave the phone that way.
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::The manifest allows Android backup"; exit 1; }
          apk=android/app/build/outputs/apk/release/app-release.apk
          abis=$(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | paste -sd' ')
          echo "Native libraries in the APK: $abis"
          [[ "$abis" == "arm64-v8a" ]] || { echo "::error::The APK must hold arm64-v8a native libraries only"; exit 1; }
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$apksigner" verify --print-certs "$apk")
          # Prints the signing certificate's SHA-1 (not a secret), the value Firebase sign-in is registered with.
          grep -E 'certificate SHA-(1|256) digest' <<< "$certs"
          if grep -q 'Android Debug' <<< "$certs"; then
            echo "::error::The APK is signed with the debug key"; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lantern-android-${{ github.run_number }}
          path: client/lantern-android/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          if-no-files-found: error
      - name: Remove the signing key and the Firebase file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/google-services.json"
